trigger:
  - main

pool:
  name: Local-Windows-Pool

stages:

# =========================
# CI STAGE
# =========================

- stage: Build
  displayName: 'Build and Publish'

  jobs:
  - job: BuildJava
    displayName: 'Build Java Application'

    steps:

    - task: Maven@4
      displayName: 'Build Java Application'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'
        jdkArchitectureOption: 'x64'

    - task: PowerShell@2
      displayName: 'Verify JAR'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Checking generated JAR..."

          Get-ChildItem "$(Build.SourcesDirectory)\target"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Application Artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\target\java-devops-demo-1.0.0.jar'
        artifact: 'java-app'


# =========================
# CD STAGE
# =========================

- stage: Deploy
  displayName: 'Deploy to Windows'
  dependsOn: Build

  jobs:
  - job: DeployJava
    displayName: 'Deploy Java Application'

    steps:

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Application Artifact'
      inputs:
        artifact: 'java-app'
        path: '$(Pipeline.Workspace)\java-app'

    - task: PowerShell@2
      displayName: 'Deploy Application'
      inputs:
        targetType: 'inline'
        script: |

          $deployPath = "C:\apps\java-devops-demo"
          $artifactPath = "$(Pipeline.Workspace)\java-app\java-devops-demo-1.0.0.jar"

          Write-Host "Deployment directory: $deployPath"
          Write-Host "Artifact: $artifactPath"

          # Create deployment directory
          if (!(Test-Path $deployPath)) {
              New-Item -ItemType Directory -Path $deployPath
          }

          # Stop existing application
          Write-Host "Stopping existing application..."

          Get-CimInstance Win32_Process |
              Where-Object {
                  $_.CommandLine -like "*java-devops-demo.jar*"
              } |
              ForEach-Object {
                  Write-Host "Stopping process $($_.ProcessId)"
                  Stop-Process -Id $_.ProcessId -Force
              }

          # Copy artifact
          Write-Host "Copying artifact..."

          Copy-Item `
              $artifactPath `
              "$deployPath\java-devops-demo.jar" `
              -Force

          $jarPath = "$deployPath\java-devops-demo.jar"
          
          $javaPath = (Get-Command java.exe -ErrorAction Stop).Source
          
          Write-Host "Java executable: $javaPath"
          Write-Host "Current user:"
          whoami
          
          Write-Host "Java version:"
          & $javaPath -version
          
          Write-Host "Starting Java application..."
          
          $stdoutLog = "$deployPath\app-stdout.log"
          $stderrLog = "$deployPath\app-stderr.log"
          
          Remove-Item $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue
          
          $process = Start-Process `
              -FilePath $javaPath `
              -ArgumentList "-jar `"$jarPath`"" `
              -WorkingDirectory $deployPath `
              -RedirectStandardOutput $stdoutLog `
              -RedirectStandardError $stderrLog `
              -PassThru
          
          Write-Host "Started process ID: $($process.Id)"
          
          Start-Sleep -Seconds 3
          $process.Refresh()
          
          if ($process.HasExited) {
              Write-Host "Java process exited."
              Write-Host "Exit code: $($process.ExitCode)"
          } else {
              Write-Host "Java process is still running."
          }
          
          Write-Host "===== STDOUT ====="
          Get-Content $stdoutLog -ErrorAction SilentlyContinue
          
          Write-Host "===== STDERR ====="
          Get-Content $stderrLog -ErrorAction SilentlyContinue
          
          Write-Host "===== PORT 8080 ====="
          Get-NetTCPConnection -LocalPort 8080 -State Listen `
              -ErrorAction SilentlyContinue
